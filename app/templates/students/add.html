{% extends "base.html" %}
{% block title %}Add Student — Eikon{% endblock %}

{% block content %}
<div class="p-6 lg:p-8 max-w-lg">
  <div class="mb-6">
    <h1 class="page-title">Add Student</h1>
    <p class="page-subtitle">Register a new student in the system</p>
  </div>

  <div class="card p-6">
    <form method="POST" action="{{ url_for('students.add') }}" class="space-y-5">

      <div>
        <label class="eikon-label">Registration Number <span style="color:var(--danger);">*</span></label>
        <input type="text" name="reg_number" required class="eikon-input" placeholder="e.g. L1F22BSCS001"/>
      </div>

      <div>
        <label class="eikon-label">Full Name <span style="color:var(--danger);">*</span></label>
        <input type="text" name="name" required class="eikon-input" placeholder="e.g. Fahad Gujjar"/>
      </div>

      <div>
        <label class="eikon-label">Email <span style="color:var(--text-muted);font-weight:400;">(optional)</span></label>
        <input type="email" name="email" class="eikon-input" placeholder="student@example.com"/>
      </div>

      <div>
        <label class="eikon-label">Class <span style="color:var(--text-muted);font-weight:400;">(optional)</span></label>
        <input type="text" name="class_name" class="eikon-input" placeholder="e.g. BSCS-6A"/>
      </div>

      <div class="alert alert-info">
        <svg class="w-4 h-4 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <span>After adding, run <code class="font-mono font-semibold px-1 py-0.5 rounded" style="background:var(--info-bg);">python core/register.py</code> to capture face images, then <code class="font-mono font-semibold px-1 py-0.5 rounded" style="background:var(--info-bg);">python core/train.py</code> to generate encodings.</span>
      </div>

      <div class="flex gap-3 pt-1">
        <button type="submit" class="btn btn-primary flex-1">Add Student</button>
        <a href="{{ url_for('students.index') }}" class="btn btn-outline">Cancel</a>
      </div>

    </form>
  </div>
</div>
{% endblock %}
