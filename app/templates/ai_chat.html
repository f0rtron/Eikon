<!-- Nixa AI Chat Widget -->

<style>
  #ai-panel {
    transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    transform: translateY(20px) scale(0.96);
    opacity: 0;
    pointer-events: none;
  }
  #ai-panel.open {
    transform: translateY(0) scale(1);
    opacity: 1;
    pointer-events: all;
  }
  .ai-msg { animation: msgIn 0.25s ease; }
  @keyframes msgIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; } }
  #ai-messages::-webkit-scrollbar { width: 4px; }
  #ai-messages::-webkit-scrollbar-thumb { background: var(--sand-400); border-radius: 100px; }
  html.dark #ai-messages::-webkit-scrollbar-thumb { background: var(--border); }
  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); }
    40% { transform: translateY(-6px); }
  }
  .nixa-suggestion {
    transition: all 0.15s ease;
  }
  .nixa-suggestion:hover {
    background: var(--cyprus) !important;
    color: var(--sand) !important;
  }
</style>

<!-- Floating button -->
<button id="ai-toggle" onclick="toggleAI()"
  class="ai-fab fixed bottom-6 right-6 w-14 h-14 rounded-full flex items-center justify-center z-40">
  <svg id="ai-icon-open" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
      d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
  </svg>
  <svg id="ai-icon-close" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
  </svg>
</button>

<!-- Chat panel -->
<div id="ai-panel"
  class="fixed bottom-24 right-6 w-96 rounded-2xl shadow-2xl flex flex-col z-40 overflow-hidden"
  style="height:520px;background:var(--card);border:1px solid var(--border);">

  <!-- Header -->
  <div class="ai-panel-header px-4 py-3.5 flex items-center gap-3 flex-shrink-0">
    <div class="w-8 h-8 rounded-xl flex items-center justify-center flex-shrink-0"
         style="background:rgba(240,237,229,0.15);">
      <svg class="w-4 h-4" style="color:#F0EDE5;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
      </svg>
    </div>
    <div class="flex-1">
      <div class="font-semibold text-[13.5px]" style="color:#F0EDE5;">Nixa</div>
      <div class="text-[11px] font-medium" style="color:rgba(240,237,229,0.45);">Eikon AI Assistant</div>
    </div>
    <div class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></div>
  </div>

  <!-- Messages -->
  <div id="ai-messages" class="flex-1 overflow-y-auto p-4 space-y-3" style="background:var(--surface-alt);">
    <div class="ai-msg flex gap-2.5">
      <div class="w-7 h-7 rounded-lg flex items-center justify-center flex-shrink-0 mt-0.5 text-[10px] font-bold"
           style="background:var(--cyprus);color:var(--sand);">N</div>
      <div class="rounded-2xl rounded-tl-sm px-3.5 py-2.5 text-[13px] max-w-[280px] leading-relaxed"
           style="background:var(--card);color:var(--text-primary);border:1px solid var(--border-light);">
        Hi! I'm <strong>Nixa</strong>, your attendance assistant. I have access to your live data — ask me about absences, defaulters, trends, or anything else.
      </div>
    </div>
  </div>

  <!-- Suggestions -->
  <div id="ai-suggestions" class="px-4 pb-2 pt-1 flex gap-2 overflow-x-auto flex-shrink-0" style="background:var(--surface-alt);">
    <button onclick="sendSuggestion('Who is absent today?')"
      class="nixa-suggestion flex-shrink-0 px-3 py-1.5 rounded-full text-[11.5px] font-medium"
      style="background:var(--color-primary-soft);color:var(--cyprus);">Who's absent?</button>
    <button onclick="sendSuggestion('List all defaulters')"
      class="nixa-suggestion flex-shrink-0 px-3 py-1.5 rounded-full text-[11.5px] font-medium"
      style="background:var(--color-primary-soft);color:var(--cyprus);">Defaulters</button>
    <button onclick="sendSuggestion('How was attendance this week?')"
      class="nixa-suggestion flex-shrink-0 px-3 py-1.5 rounded-full text-[11.5px] font-medium"
      style="background:var(--color-primary-soft);color:var(--cyprus);">This week</button>
  </div>

  <!-- Input -->
  <div class="px-4 pb-4 pt-2 flex-shrink-0" style="border-top:1px solid var(--border-light);background:var(--card);">
    <div class="flex gap-2 items-end">
      <textarea id="ai-input"
        placeholder="Ask Nixa about attendance..."
        rows="1"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"
        oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,80)+'px'"
        class="eikon-input flex-1 resize-none !py-2.5 !text-[13px] !rounded-xl"></textarea>
      <button onclick="sendMessage()"
        class="w-9 h-9 rounded-xl flex items-center justify-center flex-shrink-0 transition-all"
        style="background:var(--cyprus);"
        onmouseover="this.style.background='var(--cyprus-500)'"
        onmouseout="this.style.background='var(--cyprus)'">
        <svg class="w-4 h-4" style="color:#F0EDE5;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<script>
let aiOpen    = false;
let aiHistory = [];
let aiTyping  = false;

function toggleAI() {
  aiOpen = !aiOpen;
  document.getElementById('ai-panel').classList.toggle('open', aiOpen);
  document.getElementById('ai-icon-open').classList.toggle('hidden', aiOpen);
  document.getElementById('ai-icon-close').classList.toggle('hidden', !aiOpen);
  if (aiOpen) setTimeout(() => document.getElementById('ai-input').focus(), 350);
}

function sendSuggestion(text) {
  document.getElementById('ai-input').value = text;
  document.getElementById('ai-suggestions').style.display = 'none';
  sendMessage();
}

function sendMessage() {
  const input = document.getElementById('ai-input');
  const msg   = input.value.trim();
  if (!msg || aiTyping) return;
  input.value = '';
  input.style.height = 'auto';

  appendMessage('user', msg);
  aiHistory.push({role: 'user', content: msg});

  const thinkingId = appendThinking();
  aiTyping = true;

  fetch('/ai/chat', {
    method:  'POST',
    headers: { 'Content-Type': 'application/json' },
    body:    JSON.stringify({ message: msg, history: aiHistory.slice(-6) }),
  })
  .then(resp => {
    if (!resp.ok) throw new Error(`Server returned ${resp.status}`);
    const reader  = resp.body.getReader();
    const decoder = new TextDecoder();
    let fullReply = '';
    removeElement(thinkingId);
    const replyId = appendMessage('ai', '▍');

    function read() {
      reader.read().then(({ done, value }) => {
        if (done) {
          aiHistory.push({ role: 'assistant', content: fullReply });
          updateMessage(replyId, fullReply);
          aiTyping = false;
          return;
        }
        const lines = decoder.decode(value).split('\n');
        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const data = line.slice(6).trim();
          if (data === '[DONE]') { aiTyping = false; return; }
          try {
            const parsed = JSON.parse(data);
            if (parsed.token) {
              fullReply += parsed.token;
              updateMessage(replyId, fullReply + '▍');
            }
            if (parsed.error) {
              updateMessage(replyId, '⚠ ' + parsed.error);
              aiTyping = false;
            }
          } catch (_) {}
        }
        read();
      });
    }
    read();
  })
  .catch(err => {
    removeElement(thinkingId);
    appendMessage('ai', '⚠ Connection error. Please check your configuration.');
    aiTyping = false;
    console.error('Nixa chat error:', err);
  });
}

function appendMessage(role, text) {
  const msgs = document.getElementById('ai-messages');
  const id   = 'msg-' + Date.now() + '-' + Math.random().toString(36).slice(2);
  const isAI = role === 'ai';
  const div  = document.createElement('div');
  div.id        = id;
  div.className = 'ai-msg flex gap-2.5' + (isAI ? '' : ' flex-row-reverse');
  div.innerHTML = `
    <div class="w-7 h-7 rounded-lg flex-shrink-0 mt-0.5 flex items-center justify-center text-[10px] font-bold"
         style="${isAI ? 'background:var(--cyprus);color:var(--sand);' : 'background:var(--sand-400);color:var(--cyprus);'}">
      ${isAI ? 'N' : 'You'}
    </div>
    <div class="rounded-2xl px-3.5 py-2.5 text-[13px] max-w-[280px] leading-relaxed"
         style="${isAI
           ? 'background:var(--card);color:var(--text-primary);border:1px solid var(--border-light);border-radius:16px 16px 16px 4px;'
           : 'background:var(--cyprus);color:var(--sand);border-radius:16px 16px 4px 16px;'}">
      ${text.replace(/\n/g, '<br>')}
    </div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return id;
}

function updateMessage(id, text) {
  const el = document.querySelector(`#${id} div:last-child`);
  if (el) el.innerHTML = text.replace(/\n/g, '<br>');
  document.getElementById('ai-messages').scrollTop = 99999;
}

function appendThinking() {
  return appendMessage('ai',
    '<span style="display:flex;gap:4px;align-items:center;">' +
    '<span style="width:6px;height:6px;background:var(--cyprus-300);border-radius:50%;animation:bounce 1s infinite 0ms;display:inline-block;"></span>' +
    '<span style="width:6px;height:6px;background:var(--cyprus-300);border-radius:50%;animation:bounce 1s infinite 200ms;display:inline-block;"></span>' +
    '<span style="width:6px;height:6px;background:var(--cyprus-300);border-radius:50%;animation:bounce 1s infinite 400ms;display:inline-block;"></span>' +
    '</span>');
}

function removeElement(id) {
  const el = document.getElementById(id);
  if (el) el.remove();
}
</script>
